<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - SITTA</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="dashboard">
    <header id="nav"></header>
    <main>
      <p class="muted" id="tanggal"></p>
      <h1 class="greet" id="greet"></h1>
      <p class="muted" id="role"></p>
      <h2>Dashboard Aplikasi SITTA</h2>
      <section class="stats" aria-label="Ringkasan">
        <div class="stat">
          <span>Judul bahan ajar</span><strong id="sJudul">0</strong>
        </div>
        <div class="stat">
          <span>Total stok</span><strong id="sStok">0</strong>
        </div>
        <div class="stat">
          <span>Delivery Order terlacak</span><strong id="sDO">0</strong>
        </div>
      </section>
    </main>
    <footer>Universitas Terbuka - Tugas Praktik 1</footer>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>

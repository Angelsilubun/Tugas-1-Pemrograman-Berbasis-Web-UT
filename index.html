<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - SITTA</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="login">
    <div class="login-page">
      <header class="login-hero">
        <h1>SITTA</h1>
        <p>
          Sistem Informasi Tiras dan Transaksi Bahan Ajar Universitas Terbuka.
        </p>
      </header>
      <main class="login-box">
        <form id="formLogin" novalidate>
          <h2>Selamat Datang</h2>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            placeholder="nama@ut.ac.id"
          />
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
          />
          <div class="row-links">
            <span></span
            ><button type="button" class="link" data-open="modalLupa">
              Lupa Password
            </button>
          </div>
          <p class="err" id="loginErr" role="alert"></p>
          <button type="submit" class="btn">Login</button>
          <p class="row-links" style="justify-content: center">
            Belum punya akun?&nbsp;<button
              type="button"
              class="link"
              data-open="modalDaftar"
            >
              Daftar
            </button>
          </p>
          <p class="hint">Akun uji: angel@ut.ac.id / angel123</p>
        </form>
      </main>
    </div>

    <div
      class="modal"
      id="modalLupa"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tLupa"
    >
      <form class="modal-card" id="formLupa" novalidate>
        <h2 id="tLupa">Lupa Password</h2>
        <p class="muted">
          Masukkan email terdaftar untuk menerima tautan reset.
        </p>
        <label for="lupaEmail">Email</label>
        <input type="email" id="lupaEmail" name="email" />
        <p class="err" id="lupaMsg" role="alert"></p>
        <div class="actions">
          <button type="button" class="btn ghost" data-close="modalLupa">
            Tutup</button
          ><button type="submit" class="btn">Kirim tautan</button>
        </div>
      </form>
    </div>

    <div
      class="modal"
      id="modalDaftar"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tDaftar"
    >
      <form class="modal-card" id="formDaftar" novalidate>
        <h2 id="tDaftar">Daftar Akun</h2>
        <label for="dNama">Nama lengkap</label>
        <input type="text" id="dNama" name="nama" />
        <label for="dEmail">Email</label>
        <input type="email" id="dEmail" name="email" />
        <label for="dPw">Password (min. 6 karakter)</label>
        <input type="password" id="dPw" name="password" />
        <label for="dKonf">Konfirmasi password</label>
        <input type="password" id="dKonf" name="konfirmasi" />
        <p class="err" id="daftarMsg" role="alert"></p>
        <div class="actions">
          <button type="button" class="btn ghost" data-close="modalDaftar">
            Batal
          </button>
          <button type="submit" class="btn">Daftar</button>
        </div>
      </form>
    </div>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
